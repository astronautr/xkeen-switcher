<svg xmlns="http://www.w3.org/2000/svg">
  <!--
    XKeen mobile icon set. Use at 20px inside a 44px button.
    Each symbol owns its stroke so external <use> references stay consistent.
  -->
  <symbol id="ico-routing" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 18v-6M5 4.5v3A4.5 4.5 0 0 0 9.5 12h5A4.5 4.5 0 0 0 19 7.5v-3"/>
      <path d="m2.5 7 2.5-2.5L7.5 7m9 0L19 4.5 21.5 7"/>
      <circle cx="12" cy="19.5" r="1.5"/>
    </g>
  </symbol>
  <symbol id="ico-pair" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round">
      <path d="M14.5 8V4.5a2 2 0 0 0-2-2h-6a2 2 0 0 0-2 2v15a2 2 0 0 0 2 2h6a2 2 0 0 0 2-2V18M8 5h3M8.5 18.5h2"/>
      <path d="M18 9.5v7m-3.5-3.5h7"/>
    </g>
  </symbol>
  <symbol id="ico-settings" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round">
      <path d="M10 2.5h4l.5 2.4L17 6.3l2.4-.5 2 3.4-1.8 1.7v2.2l1.8 1.7-2 3.4-2.4-.5-2.5 1.4-.5 2.4h-4l-.5-2.4L7 17.7l-2.4.5-2-3.4 1.8-1.7v-2.2L2.6 9.2l2-3.4 2.4.5 2.5-1.4Z"/>
      <circle cx="12" cy="12" r="3"/>
    </g>
  </symbol>
  <symbol id="ico-refresh" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round">
      <path d="M20 8a8.5 8.5 0 0 0-14-2L3.5 8.5m0-5v5h5M4 16a8.5 8.5 0 0 0 14 2l2.5-2.5m0 5v-5h-5"/>
    </g>
  </symbol>
  <symbol id="ico-chevron" viewBox="0 0 24 24">
    <path d="m9 6 6 6-6 6" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
  <symbol id="ico-close" viewBox="0 0 24 24">
    <path d="m6 6 12 12M18 6 6 18" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
  <symbol id="ico-check" viewBox="0 0 24 24">
    <path d="m5 12 4.5 4.5L19 7" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
  <symbol id="ico-history" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round">
      <path d="M3.5 9a8.5 8.5 0 1 1 1.6 8M3.5 4v5h5M12 7.5V12l3 2"/>
    </g>
  </symbol>
  <symbol id="ico-power" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round">
      <path d="M12 2.5v9M7 5.5a8.5 8.5 0 1 0 10 0"/>
    </g>
  </symbol>
  <symbol id="ico-route-check" viewBox="0 0 24 24">
    <path d="M2.5 12h4l3-7.5 5 15 3-7.5h4" fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round"/>
  </symbol>
  <!-- Find a working route: a winding route from a start node. -->
  <symbol id="ico-route-find" viewBox="0 0 24 24">
    <g fill="none" stroke="currentColor" stroke-width="1.65" stroke-linecap="round" stroke-linejoin="round">
      <circle cx="5" cy="19" r="2"/>
      <path d="M7 19h7.5a3.5 3.5 0 0 0 0-7h-5a3.5 3.5 0 0 1 0-7H19"/>
    </g>
  </symbol>
  <!-- Device-row pin: its head inherits fill for the reserved-IP state. -->
  <symbol id="ico-device-pin" viewBox="0 0 16 16">
    <g stroke="currentColor" stroke-width="1.3" stroke-linecap="square" stroke-linejoin="miter">
      <path d="M5 2h6l-1 4.5 2 2V10H4V8.5l2-2Z" fill="inherit"/>
      <path d="M8 10v4" fill="none"/>
    </g>
  </symbol>
</svg>
